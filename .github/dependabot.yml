version: 2
updates:
  # One grouped PR a week keeps the noise down; majors still come in alone,
  # since the repo's rule is that they need a compatibility check first.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Node types must match the Node we run on (CI and `engines`: 20), or
      # they advertise APIs the runtime doesn't have. Bump with the runtime.
      - dependency-name: "@types/node"
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
